name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支上的新提交直接顶掉上一次仍在跑的构建
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        working-directory: web
        run: pnpm run type

      - name: 构建前端
        working-directory: web
        run: npx rspack build -c rspack.config.ts
        env:
          NODE_ENV: production

      - name: 写入网页包版本标记
        working-directory: web
        run: |
          set -euo pipefail
          v=$(grep -m1 '^versionName=' ../android/version.properties | cut -d= -f2 | tr -d '\r[:space:]')
          printf '{"version":"%s","builtAt":"%s"}\n' "$v" "$(date -u +%FT%TZ)" > dist/version.json
          cat dist/version.json

      # 网页包单独发布：应用内可以直接换掉网页，不必重装 APK
      - name: 打包网页更新包
        run: |
          set -euo pipefail
          v=$(grep -m1 '^versionName=' android/version.properties | cut -d= -f2 | tr -d '\r[:space:]')
          cd web/dist
          zip -qr "$PWD/../../web-v$v.zip" .
          cd ../..
          ls -lh "web-v$v.zip"
          unzip -l "web-v$v.zip" | head -5

      - name: 把产物放进 Android assets
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r web/dist/. android/app/src/main/assets/www/
          # 产物没到位时构建仍然会成功、但装上打开是空白页，这里提前拦住
          test -f android/app/src/main/assets/www/index.html
          echo "www 文件数: $(find android/app/src/main/assets/www -type f | wc -l)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里不放 gradle-wrapper.jar，直接用 setup-gradle 提供 gradle 命令
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        working-directory: android
        # versionCode 取 run number：保证每次构建严格递增，能覆盖安装并保留数据
        run: gradle assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: 校验签名指纹
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$signer" verify --print-certs "$apk" | grep -i 'SHA-256 digest' | head -2
          echo "固定签名指纹应为 06:53:B1:43:97:23:49:C0:32:C9:24:6A:F4:C8:B9:67:A5:CC:4F:BE:2C:11:1F:1E:C2:D7:B2:3D:E6:65:7D:F1"

      # 构建绿不等于装上能用：确认 Web 产物真的进了 APK
      - name: 校验 APK 内的前端产物
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          echo "== APK 内 assets/www =="
          unzip -l "$apk" | grep 'assets/www/' | wc -l
          for f in assets/www/index.html assets/www/catalog/catalog.json assets/www/catalog/providers.json; do
            unzip -l "$apk" "$f" >/dev/null || { echo "缺少 $f"; exit 1; }
            echo "OK  $f"
          done
          unzip -p "$apk" assets/www/index.html | head -c 400; echo

      - name: 写出构建信息
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$apk"
          {
            echo "### APK 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`$GITHUB_SHA\` |"
            echo "| 运行号 | $GITHUB_RUN_NUMBER |"
            echo "| 大小 | $(du -h "$apk" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 读取版本号
        id: ver
        run: |
          set -euo pipefail
          v=$(grep -m1 '^versionName=' android/version.properties | cut -d= -f2 | tr -d '\r[:space:]')
          test -n "$v" || { echo "version.properties 里没有 versionName"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "本次版本：v$v"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-tablet-v${{ steps.ver.outputs.value }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # main 分支上发布 release：标签与标题直接用应用版本号，不再用 run number
      - name: 生成更新说明
        run: |
          set -euo pipefail
          v=${{ steps.ver.outputs.value }}
          {
            echo "版本 v$v（构建 ${{ github.run_number }}）"
            echo
            echo "app-debug.apk：完整安装包，直接覆盖安装（需允许「未知来源」）"
            echo "web-v$v.zip：网页更新包，应用内「设置 → 通用 → 检查更新」可直接拉取，不用重装"
            echo
            if [ -f release-notes.md ]; then
              cat release-notes.md
            else
              echo "本次改动：小版本维护。"
            fi
          } > release-body.md
          cat release-body.md

      - name: 生成 latest.json
        run: |
          set -euo pipefail
          v=$(grep -m1 '^versionName=' android/version.properties | cut -d= -f2 | tr -d '\r[:space:]')
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          web=web-v$v.zip
          notes=$(jq -Rs . < release-notes.md)
          cat > latest.json <<EOF
          {
            "version": "$v",
            "tag": "v$v",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$v/app-debug.apk",
            "apkSize": $(stat -c%s "$apk"),
            "webUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$v/web-v$v.zip",
            "webSize": $(stat -c%s "$web"),
            "notes": $notes
          }
          EOF
          cat latest.json

      - name: 发布 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: v${{ steps.ver.outputs.value }}
          # 同一版本重跑时更新已有 release，而不是失败
          allowUpdates: true
          prerelease: false
          generate_release_notes: false
          body_path: release-body.md
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            web-v${{ steps.ver.outputs.value }}.zip
            latest.json
