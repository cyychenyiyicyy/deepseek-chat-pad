name: Build APK

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

# 同一个分支上的新提交直接顶掉上一次仍在跑的构建
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # 要跟上一个 tag 比对 android/ 是否变化，浅克隆拿不到 tag
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        working-directory: web
        run: pnpm run type

      - name: 构建前端
        working-directory: web
        run: npx rspack build -c rspack.config.ts
        env:
          NODE_ENV: production

      # 远程层的自测：36 套，任何一套非零退出就红（用 web 里装好的 tsx 跑，不挑 Node 版本）
      - name: 远程自测
        working-directory: web
        run: pnpm run selftest

      # Android 源文件 / 清单 / 资源的结构检查，不需要 JDK 和 Android SDK
      - name: Android 静态检查
        run: node tools/check-android-shell.cjs

      # 三档视口 + 远程功能的浏览器回归：先用测试入口构建一份模拟主机的产物
      - name: 构建浏览器回归产物
        working-directory: web
        run: npx rspack build -c ../tools/qa/tablet-qa.config.ts
        env:
          NODE_ENV: production

      - name: 浏览器回归
        run: node tools/check-tablet-layout.mjs
        env:
          QA_DIST: tmp/qa-dist
          CHROME_PATH: /usr/bin/google-chrome

      - name: 启动冒烟（无头浏览器）
        # 构建产物能不能真的跑起来：tsc 抓不到运行期错误（v1.8.6 黑屏就是这么漏的）
        run: node tools/check-web-boot.cjs
        env:
          REQUIRE_BROWSER: '1'

      - name: 写入网页包版本标记
        working-directory: web
        run: |
          set -euo pipefail
          v=$(grep -m1 '^versionName=' ../android/version.properties | cut -d= -f2 | tr -d '\r[:space:]')
          printf '{"version":"%s","builtAt":"%s"}\n' "$v" "$(date -u +%FT%TZ)" > dist/version.json
          cat dist/version.json

      # 网页包单独发布：应用内可以直接换掉网页，不必重装 APK
      - name: 打包网页更新包
        run: |
          set -euo pipefail
          v=$(grep -m1 '^versionName=' android/version.properties | cut -d= -f2 | tr -d '\r[:space:]')
          cd web/dist
          zip -qr "$PWD/../../web-v$v.zip" .
          cd ../..
          ls -lh "web-v$v.zip"
          unzip -l "web-v$v.zip" | head -5

      - name: 把产物放进 Android assets
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r web/dist/. android/app/src/main/assets/www/
          # 产物没到位时构建仍然会成功、但装上打开是空白页，这里提前拦住
          test -f android/app/src/main/assets/www/index.html
          echo "www 文件数: $(find android/app/src/main/assets/www -type f | wc -l)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里不放 gradle-wrapper.jar，直接用 setup-gradle 提供 gradle 命令
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        working-directory: android
        # versionCode 取 run number：保证每次构建严格递增，能覆盖安装并保留数据
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }} 2>&1 | tee /tmp/gradle.log

      # 编译失败的原始日志只有 admin 能下载；失败时把关键行抛成注解，手机/网页都能看到原因
      - name: 汇报编译错误
        if: failure()
        run: |
          test -f /tmp/gradle.log || exit 0
          grep -E "error:|error;|错误:|^e: |Execution failed|What went wrong" /tmp/gradle.log \
            | head -n 40 \
            | tr -d '\r' | sed 's/%/%25/g' \
            | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 40 /tmp/gradle.log | tr -d '\r' | while IFS= read -r line; do echo "::notice::$line"; done

      - name: 校验签名指纹
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$signer" verify --print-certs "$apk" | grep -i 'SHA-256 digest' | head -2
          echo "固定签名指纹应为 06:53:B1:43:97:23:49:C0:32:C9:24:6A:F4:C8:B9:67:A5:CC:4F:BE:2C:11:1F:1E:C2:D7:B2:3D:E6:65:7D:F1"

      # 构建绿不等于装上能用：确认 Web 产物真的进了 APK
      - name: 校验 APK 内的前端产物
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          echo "== APK 内 assets/www =="
          unzip -l "$apk" | grep 'assets/www/' | wc -l
          for f in assets/www/index.html assets/www/catalog/catalog.json assets/www/catalog/providers.json; do
            unzip -l "$apk" "$f" >/dev/null || { echo "缺少 $f"; exit 1; }
            echo "OK  $f"
          done
          unzip -p "$apk" assets/www/index.html | head -c 400; echo

      - name: 写出构建信息
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$apk"
          {
            echo "### APK 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`$GITHUB_SHA\` |"
            echo "| 运行号 | $GITHUB_RUN_NUMBER |"
            echo "| 大小 | $(du -h "$apk" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 读取版本号
        id: ver
        run: |
          set -euo pipefail
          v=$(grep -m1 '^versionName=' android/version.properties | cut -d= -f2 | tr -d '\r[:space:]')
          test -n "$v" || { echo "version.properties 里没有 versionName"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "本次版本：v$v"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-tablet-v${{ steps.ver.outputs.value }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # main 分支上发布 release：标签与标题直接用应用版本号，不再用 run number
      - name: 判断本次是网页更新还是本体更新
        id: native
        run: |
          set -euo pipefail
          v=${{ steps.ver.outputs.value }}
          prev=$(git tag --sort=-v:refname | grep -v "^v$v$" | head -1 || true)
          if [ -z "$prev" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "首个版本：本体更新"
            exit 0
          fi
          # 版本号文件每次发版都会变，不能算作「原生改动」
          if git diff --quiet "$prev" HEAD -- android/ ':(exclude)android/version.properties'; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "自 $prev 起 android/ 没有变化 ⇒ 本次是网页更新，只发网页包"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "自 $prev 起 android/ 有改动 ⇒ 本次是本体更新，只发 APK"
          fi

      - name: 生成更新说明
        run: |
          set -euo pipefail
          v=${{ steps.ver.outputs.value }}
          {
            if [ "${{ steps.native.outputs.required }}" = "true" ]; then
              echo "【本体更新】v$v（构建 ${{ github.run_number }}）"
              echo
              echo "下载 app-debug.apk 覆盖安装即可，最新网页已经打包在里面。"
            else
              echo "【网页更新】v$v（构建 ${{ github.run_number }}）"
              echo
              echo "打开应用 → 设置 → 通用 → 检查更新 → 「更新网页」，不用重装应用。"
            fi
            echo
            if [ -f release-notes.md ]; then
              cat release-notes.md
            else
              echo "本次改动：小版本维护。"
            fi
          } > release-body.md
          cat release-body.md

      - name: 生成 latest.json
        run: |
          set -euo pipefail
          v=${{ steps.ver.outputs.value }}
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          web=web-v$v.zip
          notes=$(jq -Rs . < release-notes.md)
          repo=https://github.com/${GITHUB_REPOSITORY}/releases/download/v$v
          if [ "${{ steps.native.outputs.required }}" = "true" ]; then
            # 本体更新：只给 APK 地址，网页地址留 null（客户端据此只提供安装包）
            apk_url="$repo/app-debug.apk"
            apk_size=$(stat -c%s "$apk")
            web_url=null
            web_size=0
            kind=native
          else
            # 网页更新：只给网页包地址，APK 地址留 null
            apk_url=null
            apk_size=0
            web_url="$repo/web-v$v.zip"
            web_size=$(stat -c%s "$web")
            kind=web
          fi
          cat > latest.json <<EOF
          {
            "version": "$v",
            "tag": "v$v",
            "kind": "$kind",
            "apkUrl": $apk_url,
            "apkSize": $apk_size,
            "webUrl": $web_url,
            "webSize": $web_size,
            "notes": $notes
          }
          EOF
          cat latest.json

      - name: 发布本体更新
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native.outputs.required == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: v${{ steps.ver.outputs.value }}
          allowUpdates: true
          prerelease: false
          generate_release_notes: false
          body_path: release-body.md
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            latest.json

      - name: 发布网页更新
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native.outputs.required == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: v${{ steps.ver.outputs.value }}
          allowUpdates: true
          prerelease: false
          generate_release_notes: false
          body_path: release-body.md
          files: |
            web-v${{ steps.ver.outputs.value }}.zip
            latest.json
