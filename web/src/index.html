<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>DeepSeek 平板</title>
    <script>
      // 首屏防闪：按已保存的主题偏好先把底色定下来（样式表里只有 :root 默认值）
      ;(function () {
        try {
          var pref = localStorage.getItem('chat-demo:theme-preference')
          var dark =
            pref === 'dark' ||
            ((pref === null || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          document.documentElement.style.backgroundColor = dark ? '#0f1115' : '#ffffff'
        } catch (error) {
          /* 存储不可用时交给后续逻辑判断 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 启动看门狗。
      //
      // 网页包一旦在加载阶段抛错（例如 TDZ 之类的初始化顺序问题），React 根本没机会挂载，
      // 用户看到的就是一片黑屏，而且重启应用也没用 —— 因为壳还是会优先加载这个坏包。
      // 这里在页面最早期埋一个计时器：到时间 App 还没报到，就通知原生壳丢弃这个包，
      // 下次启动自动回退到 APK 内置的网页。这段必须是普通脚本、不能依赖 bundle 加载成功。
      ;(function () {
        var BOOT_TIMEOUT = 8000
        var reported = false
        function report(reason) {
          if (reported || window.__dsBooted) return
          reported = true
          try {
            fetch('/__ds_update/boot-failed?reason=' + encodeURIComponent(reason), {
              method: 'POST',
              cache: 'no-store',
            })
          } catch (error) {
            /* 上报失败也没关系，下次启动还会再判 */
          }
        }
        window.addEventListener('error', function (event) {
          if (!window.__dsBooted) report(String((event && event.message) || 'error'))
        })
        setTimeout(function () {
          report('timeout')
        }, BOOT_TIMEOUT)
      })()
    </script>
  </body>
</html>
