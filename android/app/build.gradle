plugins {
    id 'com.android.application'
}

// CI 通过 -PversionCode=<run number> 传入，保证每次构建版本号严格递增（能覆盖安装）
def ciVersionCode = (findProperty('versionCode') ?: '3').toString().toInteger()
def ciVersionName = (findProperty('versionName') ?: '1.3.0').toString()

android {
    // AGP 8 起用 namespace 取代 AndroidManifest 里的 package 属性
    namespace 'ai.deepseek.tablet'
    compileSdk 34

    /**
     * 固定签名。
     *
     * 仓库里带了一份自签密钥（android/keystore/release.p12）。每次构建都用它，
     * 新包才能直接覆盖安装并保留数据；CI 每次随机生成调试签名的话，
     * 用户就必须「卸载 → 重装」，本地存储（对话、API Key）会一起清空。
     */
    signingConfigs {
        release {
            storeFile file('../keystore/release.p12')
            storePassword 'deepseek-tablet-2026'
            keyAlias 'deepseek-tablet'
            keyPassword 'deepseek-tablet-2026'
        }
    }

    defaultConfig {
        applicationId 'ai.deepseek.tablet'
        minSdk 28
        targetSdk 34
        versionCode ciVersionCode
        versionName ciVersionName
    }

    buildTypes {
        debug {
            minifyEnabled false
            // 与 release 同一把钥匙：调试包也能直接覆盖安装到已装好的版本上
            signingConfig signingConfigs.release
        }
        release {
            // 先保证能跑：不开混淆；与 debug 共用仓库里的固定自签密钥
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    // AGP 8 默认关闭 BuildConfig，代码里要用 BuildConfig.VERSION_NAME，必须显式打开
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'META-INF/INDEX.LIST'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.annotation:annotation:1.8.0'
    // 共享 OkHttpClient（内部是 Kotlin 写的，kotlin-stdlib 会随 POM 自动带进来，无需 Kotlin 插件）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
